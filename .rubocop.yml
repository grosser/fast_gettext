plugins:
  - rubocop-packaging

AllCops:
  TargetRubyVersion: 3.3 # keep in sync with minimum version
  SuggestExtensions: false
  NewCops: enable
  Exclude:
  - vendor/**/*
  - gemfiles/vendor/**/*
  - lib/fast_gettext/vendor/**/*
  - spec/**/* # TODO
  - gemfiles/**/* # TODO

Metrics:
  Enabled: false

Style/StringLiterals:
  Enabled: false

Gemspec/OrderedDependencies:
  Enabled: false

Style/WordArray:
  EnforcedStyle: brackets

Style/IfUnlessModifier:
  Enabled: false

Lint/AssignmentInCondition:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/Lambda:
  EnforcedStyle: literal

Naming/MethodName:
  Enabled: false

Style/SymbolArray:
  EnforcedStyle: brackets

Style/PerlBackrefs:
  Enabled: false

Style/DoubleNegation:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false

Gemspec/DevelopmentDependencies:
  EnforcedStyle: gemspec # gemfiles/*.gemfile load them via `gemspec`

Naming/PredicateMethod:
  Enabled: false # renaming public reload/etc would break the api

Style/DocumentDynamicEvalDefinition:
  Enabled: false

Naming/BlockForwarding:
  EnforcedStyle: explicit

Style/ArgumentsForwarding:
  UseAnonymousForwarding: false

Style/FetchEnvVar:
  Enabled: false
